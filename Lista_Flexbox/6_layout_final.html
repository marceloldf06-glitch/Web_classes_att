<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout 6</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    min-height: 100vh;
    width: 100vw;
    overflow-x: hidden;
  }
  .moldura {
    background: #f2f2f2;
    padding: 14px;
    width: 100vw;
    height: 100vh;
  }
  .grade {
    display: grid;
    width: 100%;
    height: 100%;
    grid-template-columns: 1.2fr 1fr 1.2fr 0.5fr;
    grid-template-rows: 1fr 1fr 1fr;
    grid-template-areas:
      "laranja  salmao  ciano   ciano"
      "azul     salmao  verde   circulos"
      "amarelo  amarelo verde   circulos";
    gap: 12px;
  }
  .laranja { grid-area: laranja; background: #f5911e; }
  .azul    { grid-area: azul;    background: #b3c6e0; }
  .amarelo { grid-area: amarelo; background: #f0ad24; }
  .salmao  { grid-area: salmao;  background: #f3b3a2; }
  .ciano   { grid-area: ciano;   background: #cfe2e0; }
  .verde   { grid-area: verde;   background: #aec86a; }
  .circulos {
    grid-area: circulos;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
  }
  .circulo { 
    width: 5vw; 
    height: 5vw; 
    max-width: 60px; 
    max-height: 60px; 
    border-radius: 50%; 
  }
  .circulo:nth-child(1) { background: #f19563; }
  .circulo:nth-child(2) { background: #d8a5a5; }
  .circulo:nth-child(3) { background: #aec86a; }
  .circulo:nth-child(4) { background: #cfc4e8; }
  @media (max-width: 600px) {
    .moldura {
      height: auto;
      min-height: 100vh;
    }
    .grade {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(7, minmax(100px, auto));
      grid-template-areas:
        "laranja"
        "azul"
        "amarelo"
        "salmao"
        "ciano"
        "verde"
        "circulos";
    }
    .circulos { flex-direction: row; justify-content: space-around; padding: 10px 0; }
    .circulo { width: 40px; height: 40px; }
  }
</style>
</head>
<body>
  <div class="moldura">
    <div class="grade">
      <div class="laranja"></div>
      <div class="azul"></div>
      <div class="amarelo"></div>
      <div class="salmao"></div>
      <div class="ciano"></div>
      <div class="verde"></div>
      <div class="circulos">
        <div class="circulo"></div>
        <div class="circulo"></div>
        <div class="circulo"></div>
        <div class="circulo"></div>
      </div>
    </div>
  </div>
</body>
</html>
