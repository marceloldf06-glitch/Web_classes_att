<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display C</title>

    <style>

        div {border: 1px solid black;
            width: 100px;
            height: 100px;
            display: inline-block;
        }

        .div1 {
            background-color: red;
            position: fixed;
            top: 0%;
            left: 0%;
        }

        .div2 {
            background-color: yellow;
            position: fixed;
            top: 0%;
            right: 0%;
        }

        .div3 {
            background-color: magenta;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .div4 {
            background-color: blue;
            position: fixed;
            bottom: 0%;
            left: 0%;
        }

        .div5 {
            background-color: green;
            position: fixed;
            bottom: 0%;
            right: 0%;
        }
    </style>
</head>
<body>
        <div class="div1">div1</div>
        <div class="div2">div2</div>
        <div class="div3">div3</div>
        <div class="div4">div4</div>
        <div class="div5">div5</div>
</body>
<!-- Eles ficam posicionados de acordo com as propriedades top, bottom, left e right,
 e o position: fixed permite fixá-los em posições definidas em relação à tela. -->    
</html>
