<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletores</title>

    <style>
        #p1 {
            color: red;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        #p2 {
            color: blue;
            font-family: arial, Helvetica, sans-serif   ;  
        }
        #p3 {
            color: green;
            font-family:Verdana, Geneva, Tahoma, sans-serif
        }
        #p4 {
            color: orange;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        #p5 {
            color: purple;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #s1 {
            font-weight:bolder;
            font-style:oblique
        }
        #s2 {
            font-weight:lighter;
            vertical-align: super;
            font-size:smaller;
        }
        #s3 {
            font-weight: 1000;
            vertical-align: sub;
            font-size: small;
        }
        #s4 {
            font-weight: bold;
            vertical-align: middle;
        }   
        #s5 {
            font-weight: 600;
            font-style: italic;
        }
        </style>
</head>
<body>
    <h1>Titúlo</h1>

    <p id="p1"><span id="s1">Lorem</span> Ipsum</p>
    <p id="p2">Lorem <span id="s2">Ipsum</span></p>
    <p id="p3">Lorem <span id="s3">Ipsum</span></p>
    <p id="p4"><span id="s4">Lorem</span> Ipsum</p>
    <p id="p5">Lorem <span id="s5">Ipsum</span></p>
</body>
</html>
