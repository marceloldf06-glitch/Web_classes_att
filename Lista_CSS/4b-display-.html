<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display B</title>

    <style>

        body {
            margin: 0;
            display: flex;
        }        

        div {
            width: 25%;
            height: 70px;
            text-align: center;
            padding-top: 30px;
        }

        .div1 { background-color: darkblue; }
        .div2 { background-color: green; }
        .div3 { background-color: red; }
        .div4 { background-color: yellow; }
    </style>
</head>
<body>
    <div class="div1">1</div>
    <div class="div2">2</div>
    <div class="div3">3</div>
    <div class="div4">4</div>
</body>
<!-- O display flex faz com que o body vire um container flexível 
 fazendo seus filhos serem organizados em linha, 
 e o width: 25% faz com que cada elemento ocupe 25% da largura da tela.-->

</html>
