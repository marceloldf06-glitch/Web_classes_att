<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barco</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { height: 100vh; overflow: hidden; }
  .cenario {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(to bottom, #dbeafe 0%, #93c5fd 70%, #3b82f6 100%);
  }
  .nuvem {
    position: absolute;
    top: 50px;
    left: -150px;
    width: 120px;
    height: 40px;
    background: #fff;
    border-radius: 20px;
    animation: moverNuvem 20s linear infinite;
  }
  #nuvem2 {
    top: 100px;
    left: -400px;
    animation: moverNuvem 10s linear infinite;
  }
  .barco {
    position: absolute;
    bottom: 80px;
    left: -100px;
    font-size: 60px;
    z-index: 2;
    animation: navegar 12s linear infinite, balancar 2s ease-in-out infinite alternate;
  }
  .mar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100px;
    background: darkblue;
    z-index: 1;
  }
  @keyframes moverNuvem {
    from { left: -150px; }
    to { left: 100vw; }
  }
  @keyframes navegar {
    from { left: -100px; }
    to { left: 100vw; }
  }
  @keyframes balancar {
    from { transform: translateY(0) rotate(-10deg); }
    to { transform: translateY(-8px) rotate(10deg); }
  }
</style>
</head>
<body>
  <div class="cenario">
    <div class="nuvem"></div>
    <div id="nuvem2" class="nuvem"></div>
    <div class="barco">🚤</div>
    <div class="mar"></div>
  </div>
</body>
</html>
