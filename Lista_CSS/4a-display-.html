<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display A</title>

    <style>
        div {
            height: 100px;
            text-align: center;
            padding-top: 25px;
        }

        .div1 { background-color: darkblue; }
        .div2 { background-color: green; }
        .div3 { background-color: red; }
        .div4 { background-color: yellow; }
    </style>
</head>
<body>
    <div class="div1">1</div>
    <div class="div2">2</div>
    <div class="div3">3</div>
    <div class="div4">4</div>
</body>

<!-- A tag div por padrão é display: block, 
 assim o fazendo ocupar toda a largura disponível fazendo os proximos aparecerem em uma nova linha.-->
</html>
